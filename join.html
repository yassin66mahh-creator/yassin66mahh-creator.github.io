<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم إلينا</title>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: #f7f7f7;
        }

        /* HEADER RED */
        .header {
            background: #b30000;
            padding: 20px;
            text-align: center;
            color: #fff;
            font-size: 26px;
            font-weight: 600;
        }

        /* MAIN IMAGE */
        .top-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        /* PAGE TITLE */
        .page-title {
            text-align: center;
            font-size: 32px;
            margin: 25px 0 10px;
            color: #b30000;
            font-weight: 700;
        }

        .page-desc {
            text-align: center;
            font-size: 18px;
            color: #444;
            margin-bottom: 30px;
        }

        /* FORM BOX */
        .form-box {
            width: 90%;
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            border: 3px solid #b30000;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .form-box input,
        .form-box textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 2px solid #b30000;
            font-size: 17px;
            background: #fff5f5;
            transition: 0.3s;
        }

        .form-box input:focus,
        .form-box textarea:focus {
            border-color: #ff3333;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255,0,0,0.3);
        }

        .send-btn {
            background: #b30000;
            color: #fff;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            font-weight: 600;
        }

        .send-btn:hover {
            background: #8a0000;
            transform: scale(1.03);
        }

        /* FOOTER */
        .footer {
            margin-top: 50px;
            background: #b30000;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <div class="header">انضم إلينا</div>

    <!-- TOP IMAGE -->
    <img src="hero.jpg" class="top-img">

    <h1 class="page-title">استمارة الانضمام</h1>
    <p class="page-desc">من فضلك املأ البيانات التالية وسيتم التواصل معك في أقرب وقت</p>

    <!-- FORM -->
    <div class="form-box">

        <form action="https://formsubmit.co/Ahmedyasseinhassan@gmail.com" method="POST">

            <input type="text" name="name" placeholder="الاسم بالكامل" required>

            <input type="text" name="phone" placeholder="رقم الهاتف" required>

            <input type="email" name="email" placeholder="البريد الإلكتروني" required>

            <textarea name="message" placeholder="اكتب رسالتك هنا" required></textarea>

            <button type="submit" class="send-btn">إرسال</button>

        </form>

    </div>

    <div class="footer">
        جميع الحقوق محفوظة © النائب أحمد ياسين حسن
    </div>

</body>
</html>
